<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f0" />
    <meta
      name="description"
      content="A thoughtfully designed calculator for everyday math."
    />
    <title>milo — a little calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Milo calculator home">
          <span class="brand-mark" aria-hidden="true">m</span>
          <span>milo</span>
        </a>
        <span class="topbar-note"><span class="status-dot"></span> Your everyday calculator</span>
      </header>

      <section class="workspace" aria-label="Calculator">
        <div class="calculator">
          <div class="display" aria-live="polite" aria-atomic="true">
            <div class="display-label">
              <span>LET’S WORK IT OUT</span>
              <button class="icon-button" id="backspace" type="button" aria-label="Delete last character" title="Delete last character">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 5 3 12l6 7h12V5H9Z" />
                  <path d="m12 9 6 6m0-6-6 6" />
                </svg>
              </button>
            </div>
            <div class="expression" id="expression" aria-label="Expression">0</div>
            <div class="result-row">
              <span class="result-equals">=</span>
              <output class="result" id="result">0</output>
            </div>
          </div>

          <div class="keypad" aria-label="Calculator keys">
            <button class="key key-utility" type="button" data-action="clear" aria-label="Clear all">AC</button>
            <button class="key key-utility" type="button" data-action="sign" aria-label="Change sign">±</button>
            <button class="key key-utility" type="button" data-action="percent" aria-label="Percent">%</button>
            <button class="key key-operator" type="button" data-value="/" aria-label="Divide">÷</button>

            <button class="key" type="button" data-value="7">7</button>
            <button class="key" type="button" data-value="8">8</button>
            <button class="key" type="button" data-value="9">9</button>
            <button class="key key-operator" type="button" data-value="*">×</button>

            <button class="key" type="button" data-value="4">4</button>
            <button class="key" type="button" data-value="5">5</button>
            <button class="key" type="button" data-value="6">6</button>
            <button class="key key-operator" type="button" data-value="-">−</button>

            <button class="key" type="button" data-value="1">1</button>
            <button class="key" type="button" data-value="2">2</button>
            <button class="key" type="button" data-value="3">3</button>
            <button class="key key-operator" type="button" data-value="+">+</button>

            <button class="key key-zero" type="button" data-value="0">0</button>
            <button class="key" type="button" data-action="decimal">.</button>
            <button class="key key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
          </div>
          <p class="keyboard-hint"><kbd>Enter</kbd> to calculate <span>·</span> <kbd>⌫</kbd> to delete</p>
        </div>

        <aside class="history" aria-label="Calculation history">
          <div class="history-heading">
            <div>
              <p class="eyebrow">YOUR SCRATCHPAD</p>
              <h2>Recent</h2>
            </div>
            <button class="clear-history" id="clear-history" type="button">Clear</button>
          </div>
          <div class="history-list" id="history-list">
            <div class="history-empty">
              <span class="empty-icon" aria-hidden="true">↗</span>
              <p>Your calculations will<br />show up here.</p>
            </div>
          </div>
          <div class="history-footer">
            <span class="footer-sparkle" aria-hidden="true">✳</span>
            <span>Made for the little things</span>
          </div>
        </aside>
      </section>

      <footer class="page-footer">
        <span>Simple math, a little more lovely.</span>
        <span class="footer-shortcut">Works with your keyboard, too <span aria-hidden="true">↗</span></span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
